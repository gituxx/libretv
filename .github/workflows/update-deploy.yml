name: Daily deploy LibreTV
on:
  schedule:
    - cron: '30 18 * * *' # 02:30 China time, after the TVBox refresh
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: libretv-update-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - name: Test subscriptions, search and public access
        run: npx vitest run src/lib/tvbox-parser.test.ts src/lib/subscription-sync.test.ts src/app/api/source-list/route.test.ts src/components/video-card.test.ts src/components/switch-source.test.ts src/lib/switch-source-cache.test.ts src/lib/client-api.test.ts src/app/api/search/route.test.ts src/lib/auth.test.ts src/app/api/auth/route.test.ts
      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build
        env:
          DEFAULT_SUBSCRIPTIONS: '["https://tvbox.oinnn.top/tvbox.json"]'
          DEFAULT_LIVE_SOURCES: '[{"name":"每日直播源","url":"https://tvbox.oinnn.top/live.m3u"}]'
          COOKIE_SECURE: 'true'
          PUBLIC_ACCESS: 'true'
          DEFAULT_RECOMMEND_SOURCE: 'douban'
      - name: Check Worker runtime before deployment
        shell: bash
        run: |
          npx opennextjs-cloudflare preview --port 8787 > "$RUNNER_TEMP/libretv-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          if ! node scripts/check-public-access.mjs http://127.0.0.1:8787; then
            cat "$RUNNER_TEMP/libretv-preview.log"
            exit 1
          fi
      - name: Deploy Cloudflare Worker
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify site and subscription
        run: |
          node scripts/check-public-access.mjs https://libretv.oinnn.top
          curl --fail --retry-all-errors --retry 4 --retry-delay 5 https://tvbox.oinnn.top/tvbox.json -o /dev/null
